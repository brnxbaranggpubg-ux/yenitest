name: Build Dimasik JAR

on:
  push:
    branches: [main]
    paths:
      - "dimasik-source.zip"
      - "dimasik.zip"
      - "dimasik.zip.part-*"
      - "dimasik/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dimasik-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate, verify, and extract source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          WORK_DIR="$RUNNER_TEMP/dimasik-source"
          mkdir -p "$WORK_DIR"

          echo "Repository root contains:"
          find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort

          ARCHIVE=""
          if [[ -f "$GITHUB_WORKSPACE/dimasik-source.zip" ]]; then
            ARCHIVE="$GITHUB_WORKSPACE/dimasik-source.zip"
          elif [[ -f "$GITHUB_WORKSPACE/dimasik.zip" ]]; then
            ARCHIVE="$GITHUB_WORKSPACE/dimasik.zip"
          elif [[ -f "$GITHUB_WORKSPACE/dimasik.zip.part-00" && -f "$GITHUB_WORKSPACE/dimasik.zip.part-01" && -f "$GITHUB_WORKSPACE/dimasik.zip.part-02" ]]; then
            ARCHIVE="$RUNNER_TEMP/dimasik.zip"
            cat "$GITHUB_WORKSPACE/dimasik.zip.part-00" \
                "$GITHUB_WORKSPACE/dimasik.zip.part-01" \
                "$GITHUB_WORKSPACE/dimasik.zip.part-02" > "$ARCHIVE"
          elif [[ -f "$GITHUB_WORKSPACE/dimasik/build.gradle" ]]; then
            echo "project_dir=$GITHUB_WORKSPACE/dimasik" >> "$GITHUB_OUTPUT"
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/dimasik" >> "$GITHUB_ENV"
            exit 0
          elif [[ -f "$GITHUB_WORKSPACE/build.gradle" ]]; then
            echo "project_dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          else
            echo "::error title=Source files missing::The repository does not contain the source archive. Upload dimasik.zip.part-00, dimasik.zip.part-01, and dimasik.zip.part-02 to the repository root, then commit all three files."
            exit 1
          fi

          EXPECTED_SHA256="a5371d92ebab76c61bb24db4cc3b6a1fb5114a8127821f166ec888a86f5e2d30"
          ACTUAL_SHA256="$(sha256sum "$ARCHIVE" | cut -d ' ' -f1)"
          echo "Archive SHA-256: $ACTUAL_SHA256"
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error title=Archive checksum mismatch::The uploaded source parts do not match the original archive. Re-upload all three parts from the same set."
            exit 1
          fi

          unzip -tq "$ARCHIVE"
          unzip -q "$ARCHIVE" -d "$WORK_DIR"

          PROJECT_BUILD_FILE="$(find "$WORK_DIR" -type f -name build.gradle -not -path '*/.gradle/*' -print -quit)"
          if [[ -z "$PROJECT_BUILD_FILE" ]]; then
            echo "::error title=Gradle project not found::The archive passed its checksum, but no build.gradle was found after extraction."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_BUILD_FILE")"
          echo "Found Gradle project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate project and apply minimal safety changes
        shell: bash
        run: |
          set -euo pipefail
          python - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          required = [
              root / "build.gradle",
              root / "gradle.properties",
              root / "src/main/resources/fabric.mod.json",
          ]
          missing = [str(path.relative_to(root)) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Required project files missing: " + ", ".join(missing))

          client = root / "src/main/java/dev/dimasik/client/DimasikClient.java"
          if client.is_file():
              content = client.read_text(encoding="utf-8")
              content = content.replace("217.60.245.54", "127.0.0.1")
              client.write_text(content, encoding="utf-8")

          media = root / "src/main/java/dev/dimasik/client/system/Class_JG8EQkxMGm8yNbUr.java"
          if media.is_file():
              content = media.read_text(encoding="utf-8")
              content = content.replace('private static final String f_9349 = "Hidden";',
                                        'private static final String f_9349 = "Normal";')
              content = content.replace('private static final String f_9351 = "Bypass";',
                                        'private static final String f_9351 = "RemoteSigned";')
              media.write_text(content, encoding="utf-8")

          print("Project layout verified. Minimal safety replacements applied only when the original strings existed.")
          PY

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"

      - name: Build mod
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          java -version
          gradle --version
          gradle --no-daemon --stacktrace clean build
          find build/libs -maxdepth 1 -name '*.jar' -type f -print
          test -n "$(find build/libs -maxdepth 1 -name '*.jar' -type f ! -name '*-sources.jar' -print -quit)"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Dimasik-JAR
          path: |
            ${{ steps.source.outputs.project_dir }}/build/libs/*.jar
            !${{ steps.source.outputs.project_dir }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Dimasik-build-diagnostics
          path: |
            ${{ runner.temp }}/dimasik-source/**
            ${{ github.workspace }}/dimasik/build/reports/**
            ${{ github.workspace }}/dimasik/build/tmp/**
          if-no-files-found: ignore
          retention-days: 7
